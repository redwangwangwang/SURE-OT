name: Finalize prepared SURE-OT tree

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/promote-sure-ot-final.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: promote-sure-ot-tree
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Promote prepared implementation and record status
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const preparedTree = "9caec003fe5df9beaa626255ffd43a01bc8139af";
            const statusText = [
              "# Implementation status",
              "",
              "SURE-OT has been integrated on top of BiOTPrompt.",
              "",
              "Prepared tree: `9caec003fe5df9beaa626255ffd43a01bc8139af`",
              "",
              "Implemented components include unbalanced residual transport, continuous evolution tokens, temporal swap consistency, baseline-compatible configuration, tests, and training scripts.",
              ""
            ].join("\n");
            const { data: blob } = await github.rest.git.createBlob({
              owner,
              repo,
              content: statusText,
              encoding: "utf-8",
            });
            const { data: tree } = await github.rest.git.createTree({
              owner,
              repo,
              base_tree: preparedTree,
              tree: [{
                path: "IMPLEMENTATION_STATUS.md",
                mode: "100644",
                type: "blob",
                sha: blob.sha,
              }],
            });
            const { data: ref } = await github.rest.git.getRef({ owner, repo, ref: "heads/main" });
            const { data: commit } = await github.rest.git.createCommit({
              owner,
              repo,
              message: "feat: finalize SURE-OT implementation",
              tree: tree.sha,
              parents: [ref.object.sha],
            });
            await github.rest.git.updateRef({
              owner,
              repo,
              ref: "heads/main",
              sha: commit.sha,
              force: false,
            });
            core.notice(`Finalized SURE-OT at ${commit.sha}`);
