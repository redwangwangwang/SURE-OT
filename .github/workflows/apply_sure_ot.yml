name: Apply and verify SURE-OT integration

on:
  push:
    branches:
      - sure-ot-reimplementation
    paths:
      - .github/workflows/apply_sure_ot.yml

permissions:
  contents: write

jobs:
  integrate-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: sure-ot-reimplementation
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Apply deterministic model and config patch
        run: |
          python .github/scripts/patch_sure_ot.py
          chmod +x scripts/7-1.sure_ot_run.sh scripts/7-2.sure_ot_test.sh

      - name: Compile modified Python files
        run: |
          python -m py_compile \
            evalcap/SURE_OT.py \
            models/R2GenGPT.py \
            configs/config.py \
            tests/test_sure_ot.py

      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pytest

      - name: Run SURE-OT unit tests
        run: pytest -q tests/test_sure_ot.py

      - name: Commit verified implementation to the branch
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/scripts/patch_sure_ot.py
          rm -f .github/workflows/apply_sure_ot.yml
          rmdir .github/scripts 2>/dev/null || true

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: implement and verify SURE-OT"
          git push origin HEAD:sure-ot-reimplementation
