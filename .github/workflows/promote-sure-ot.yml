name: Promote prepared SURE-OT tree

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/promote-sure-ot.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Attach prepared SURE-OT tree to main
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const preparedTree = "9caec003fe5df9beaa626255ffd43a01bc8139af";
            const { data: ref } = await github.rest.git.getRef({
              owner,
              repo,
              ref: "heads/main",
            });
            const { data: commit } = await github.rest.git.createCommit({
              owner,
              repo,
              message: "feat: implement SURE-OT on BiOTPrompt",
              tree: preparedTree,
              parents: [ref.object.sha],
            });
            await github.rest.git.updateRef({
              owner,
              repo,
              ref: "heads/main",
              sha: commit.sha,
              force: false,
            });
            core.notice(`Promoted prepared tree as ${commit.sha}`);
